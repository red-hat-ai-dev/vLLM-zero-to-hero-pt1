name: Publish container images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            base: docker.io/vllm/vllm-openai:v0.28.0
          - variant: rocm
            base: docker.io/vllm/vllm-openai-rocm:v0.28.0
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Preserve the public package consumed by Parts 1 and 3.
          images: ghcr.io/red-hat-ai-dev/vllm-zero-to-hero
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=ref,event=tag,suffix=-${{ matrix.variant }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VLLM_IMAGE=${{ matrix.base }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
